name: Reusable Mise Deploy Workflow

on:
  workflow_call:
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - run: |
          mkdir -p ~/.ssh
          ssh-keyscan ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          if [ -n "${{ secrets.DEPLOY_HOST_PROD }}" ]; then
            ssh-keyscan ${{ secrets.DEPLOY_HOST_PROD }} >> ~/.ssh/known_hosts
          fi

      # - name: Setup .npmrc for GitHub Packages
      #   run: |
      #     echo "@${{ github.repository_owner }}:registry=https://npm.pkg.github.com" > .npmrc
      #     echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
      #     echo "@nuqayah:registry=https://npm.pkg.github.com" >> .npmrc

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          DEPLOY_HOST_PROD: ${{ secrets.DEPLOY_USER_PROD }}@${{ secrets.DEPLOY_HOST_PROD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max_old_space_size=8192"
        run: |
          perl -i -pe 's/(python.uv_venv_auto =) true/$1 false/' mise.toml
          mise run deploy
